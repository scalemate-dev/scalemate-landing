<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1a1a1a; rx: 16; }
    .figure { fill: #333; }
    .figure-winner { fill: #F97316; }
    .big-num { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 72px; font-weight: 800; fill: #ffffff; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; font-weight: 500; fill: #999; }
    .sublabel { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 12px; fill: #666; }
    .divider { stroke: #333; stroke-width: 1; }
  </style>

  <!-- Background -->
  <rect width="720" height="180" class="bg" rx="16"/>

  <!-- Left side: big number -->
