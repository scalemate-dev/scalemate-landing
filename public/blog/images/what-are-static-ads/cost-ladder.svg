<svg width="1440" height="810" viewBox="0 0 1440 810" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1 { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 30px; font-weight: 800; fill: #1a1a1a; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 17px; font-weight: 500; fill: #888; }
    .price { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 40px; font-weight: 800; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; fill: #999; text-anchor: middle; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; fill: #999; }
    .mult { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #999; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="90" y="78" class="h1">Cost per creative: static is the cheapest unit of volume</text>
  <text x="90" y="110" class="sub">Rough production cost of one creative — directional, not a benchmark</text>

  <!-- baseline -->
  <line x1="120" y1="640" x2="1360" y2="640" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="64" y="400" class="axis-label" text-anchor="middle" transform="rotate(-90, 64, 400)">Cost per creative</text>

  <!-- Step columns: ascending heights. baseline y=640 -->
  <!-- STEP 1: Static (AI) ~$5-15 -->
  <g>
    <rect x="180" y="540" width="220" height="100" rx="8" fill="#F97316"/>
    <text x="290" y="525" class="price" fill="#F97316" text-anchor="middle">$5–15</text>
    <text x="290" y="582" class="name" fill="#ffffff">Static (AI)</text>
    <text x="290" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#ffe9dc" text-anchor="middle">the cheapest unit</text>
    <text x="290" y="668" class="desc">AI-assisted image</text>
  </g>

  <!-- STEP 2: Video (AI) $20-50 -->
  <g>
    <rect x="480" y="400" width="220" height="240" rx="8" fill="#FB923C"/>
    <text x="590" y="385" class="price" fill="#FB923C" text-anchor="middle">$20–50</text>
    <text x="590" y="490" class="name" fill="#ffffff">Video (AI)</text>
    <text x="590" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#fff3ea" text-anchor="middle">often underperforms</text>
    <text x="590" y="668" class="desc">2–10× a static</text>
  </g>

  <!-- STEP 3: UGC self-sourced from $100 -->
  <g>
    <rect x="780" y="270" width="220" height="370" rx="8" fill="#9a9a9a"/>
    <text x="890" y="255" class="price" fill="#737373" text-anchor="middle">$100+</text>
    <text x="890" y="430" class="name" fill="#ffffff">UGC (self-sourced)</text>
    <text x="890" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#f0f0f0" text-anchor="middle">region-dependent</text>
    <text x="890" y="668" class="desc">~10× a static</text>
  </g>

  <!-- STEP 4: US creator + agency $250+ -->
  <g>
    <rect x="1080" y="160" width="220" height="480" rx="8" fill="#3f3f3f"/>
    <text x="1190" y="145" class="price" fill="#3f3f3f" text-anchor="middle">$250+</text>
    <text x="1190" y="380" class="name" fill="#ffffff">UGC (US creator + agency)</text>
    <text x="1190" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" fill="#cfcfcf" text-anchor="middle">premium production</text>
    <text x="1190" y="668" class="desc">20–50× a static</text>
  </g>

  <!-- Volume callout: bottom -->
  <g transform="translate(180, 720)">
    <rect x="0" y="0" width="1120" height="58" rx="12" fill="#FFF3EE" stroke="#E8591A" stroke-width="1.5"/>
    <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#E8591A">Andromeda wants 15–20 creatives per ad set.</text>
    <text x="498" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="17" font-weight="500" fill="#8a4a30">Only statics make that volume affordable without a video budget.</text>
  </g>
</svg>
