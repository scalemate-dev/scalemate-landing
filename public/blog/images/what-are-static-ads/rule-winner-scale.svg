<svg width="1160" height="520" viewBox="0 0 1160 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FEFCFA"/>
    </linearGradient>
    <filter id="cardShadowW" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#1a1614" flood-opacity="0.08"/>
    </filter>
    <style>
      .ttlW  { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 30px; font-weight: 800; fill: #1a1614; }
      .labW  { font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .monoW { font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; font-size: 22px; font-weight: 600; fill: #1a1614; }
      .monosW{ font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; font-size: 15px; font-weight: 600; }
      .chipW { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; font-weight: 600; }
      .footW { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 14px; font-weight: 500; fill: #9C9890; }
      .opW   { fill: #ea580c; }
    </style>
  </defs>

  <!-- Card -->
  <rect x="40" y="36" width="1080" height="448" rx="18" fill="url(#panelW)" stroke="#1a1614" stroke-opacity="0.09" stroke-width="1.5" filter="url(#cardShadowW)"/>

  <!-- Header chips -->
  <rect x="72" y="72" width="166" height="30" rx="8" fill="#f97316" fill-opacity="0.10"/>
  <text x="155" y="92" class="labW" fill="#ea580c" text-anchor="middle">SCALE WINNERS</text>

  <rect x="250" y="72" width="74" height="30" rx="8" fill="#1a1614" fill-opacity="0.05"/>
  <text x="287" y="92" class="chipW" fill="#475467" text-anchor="middle">Meta</text>

  <rect x="336" y="72" width="80" height="30" rx="8" fill="#1a1614" fill-opacity="0.05"/>
  <text x="376" y="92" class="chipW" fill="#475467" text-anchor="middle">Ad level</text>

  <text x="1088" y="92" class="monosW" fill="#9C9890" text-anchor="end">checks every 3h</text>

  <!-- Title -->
  <text x="72" y="162" class="ttlW">Catch a winner the moment it clears</text>

  <!-- IF block -->
  <text x="72" y="244" class="labW" fill="#9C9890">IF</text>
  <rect x="72" y="262" width="1016" height="64" rx="12" fill="#1a1614" fill-opacity="0.025" stroke="#1a1614" stroke-opacity="0.06" stroke-width="1"/>
  <text x="96" y="302" class="monoW">ROAS <tspan class="opW">&#8805;</tspan> target   <tspan class="opW">AND</tspan>   purchases <tspan class="opW">&#8805;</tspan> 5</text>
  <text x="1064" y="300" class="monosW" fill="#9C9890" text-anchor="end">last 3 days</text>

  <!-- arrow -->
  <path d="M580 338 L580 372 M580 372 l-8 -10 M580 372 l8 -10" stroke="#9C9890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- THEN block (compound) -->
  <text x="72" y="404" class="labW" fill="#ea580c">THEN</text>
  <rect x="72" y="422" width="216" height="44" rx="10" fill="#f97316"/>
  <text x="180" y="450" class="chipW" fill="#FFFFFF" text-anchor="middle" style="font-size:16px;font-weight:700;">Scale budget +20%</text>

  <rect x="300" y="422" width="300" height="44" rx="10" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="450" y="450" class="chipW" fill="#ea580c" text-anchor="middle" style="font-size:16px;font-weight:700;">Notify — trigger next batch</text>

  <text x="1088" y="452" class="footW" text-anchor="end">The rule notices the winner so you don&#8217;t have to</text>
</svg>
