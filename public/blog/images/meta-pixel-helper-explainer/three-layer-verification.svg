<svg width="1440" height="810" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1440" height="810" fill="#fcfcfb"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="720" y="90" text-anchor="middle" font-size="34" font-weight="600" fill="#0b0b0b">Three layers of pixel verification</text>
  <text x="720" y="130" text-anchor="middle" font-size="20" fill="#52514e">Each layer confirms something the one before it can't</text>

  <!-- Layer 1: Pixel Helper -->
  <rect x="90" y="240" width="360" height="360" rx="20" fill="#86b6ef"/>
  <text x="270" y="300" text-anchor="middle" font-size="22" font-weight="600" fill="#0b0b0b">1. Pixel Helper</text>
  <text x="270" y="332" text-anchor="middle" font-size="16" fill="#0b0b0b" opacity="0.75">(browser extension)</text>
  <text x="270" y="390" text-anchor="middle" font-size="16" fill="#0b0b0b">Confirms the Pixel</text>
  <text x="270" y="414" text-anchor="middle" font-size="16" fill="#0b0b0b">and its event code</text>
  <text x="270" y="438" text-anchor="middle" font-size="16" fill="#0b0b0b">fired in your browser</text>
  <text x="270" y="486" text-anchor="middle" font-size="15" font-weight="600" fill="#184f95">Doesn't confirm</text>
  <text x="270" y="508" text-anchor="middle" font-size="15" font-weight="600" fill="#184f95">Meta received it</text>

  <!-- Layer 2: Test Events -->
  <rect x="540" y="240" width="360" height="360" rx="20" fill="#3987e5"/>
  <text x="720" y="300" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">2. Test Events</text>
  <text x="720" y="332" text-anchor="middle" font-size="16" fill="#ffffff" opacity="0.85">(Events Manager)</text>
  <text x="720" y="390" text-anchor="middle" font-size="16" fill="#ffffff">Shows events as they</text>
  <text x="720" y="414" text-anchor="middle" font-size="16" fill="#ffffff">arrive server-side,</text>
  <text x="720" y="438" text-anchor="middle" font-size="16" fill="#ffffff">in real time</text>
  <text x="720" y="486" text-anchor="middle" font-size="15" font-weight="600" fill="#e1e0d9">Confirms receipt,</text>
  <text x="720" y="508" text-anchor="middle" font-size="15" font-weight="600" fill="#e1e0d9">not delivery method</text>

  <!-- Layer 3: Conversions API -->
  <rect x="990" y="240" width="360" height="360" rx="20" fill="#1c5cab"/>
  <text x="1170" y="300" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">3. Conversions API</text>
  <text x="1170" y="332" text-anchor="middle" font-size="16" fill="#ffffff" opacity="0.85">(server-to-server)</text>
  <text x="1170" y="390" text-anchor="middle" font-size="16" fill="#ffffff">Sends events directly</text>
  <text x="1170" y="414" text-anchor="middle" font-size="16" fill="#ffffff">from your server,</text>
  <text x="1170" y="438" text-anchor="middle" font-size="16" fill="#ffffff">bypassing the browser</text>
  <text x="1170" y="486" text-anchor="middle" font-size="15" font-weight="600" fill="#cde2fb">Immune to ad-blocker</text>
  <text x="1170" y="508" text-anchor="middle" font-size="15" font-weight="600" fill="#cde2fb">interference</text>

  <!-- connecting arrows -->
  <line x1="454" y1="420" x2="536" y2="420" stroke="#898781" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="904" y1="420" x2="986" y2="420" stroke="#898781" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="720" y="670" text-anchor="middle" font-size="17" fill="#52514e">A clean read on layer 1 only proves the browser side. Pair it with layer 2 before you trust the signal.</text>
</svg>
