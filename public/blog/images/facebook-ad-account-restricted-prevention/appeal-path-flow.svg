<svg width="1440" height="810" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <text x="60" y="64" font-size="34" font-weight="600" fill="#3b3a33">Meta's official route back, in the order Meta lists it</text>
  <text x="60" y="104" font-size="20" fill="#6b6a62">Four steps in Business Support Home. Everything else is waiting.</text>

  <!-- STEP 1 -->
  <rect x="60" y="160" width="300" height="230" rx="16" fill="#f2f7fd" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="104" cy="208" r="24" fill="#2a78d6"/>
  <text x="104" y="216" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <text x="144" y="216" font-size="21" font-weight="600" fill="#3b3a33">Confirm your</text>
  <text x="144" y="242" font-size="21" font-weight="600" fill="#3b3a33">identity</text>
  <text x="92" y="292" font-size="17" fill="#4a4942">Open Account status</text>
  <text x="92" y="320" font-size="17" fill="#4a4942">overview and select the</text>
  <text x="92" y="348" font-size="17" fill="#4a4942">restricted account.</text>

  <!-- STEP 2 -->
  <rect x="400" y="160" width="300" height="230" rx="16" fill="#f2f7fd" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="444" cy="208" r="24" fill="#2a78d6"/>
  <text x="444" y="216" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <text x="484" y="216" font-size="21" font-weight="600" fill="#3b3a33">Complete</text>
  <text x="484" y="242" font-size="21" font-weight="600" fill="#3b3a33">verification</text>
  <text x="432" y="292" font-size="17" fill="#4a4942">Business verification</text>
  <text x="432" y="320" font-size="17" fill="#4a4942">decisions can take up to</text>
  <text x="432" y="348" font-size="17" fill="#4a4942">14 business days.</text>

  <!-- STEP 3 -->
  <rect x="740" y="160" width="300" height="230" rx="16" fill="#f2f7fd" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="784" cy="208" r="24" fill="#2a78d6"/>
  <text x="784" y="216" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <text x="824" y="216" font-size="21" font-weight="600" fill="#3b3a33">Secure your</text>
  <text x="824" y="242" font-size="21" font-weight="600" fill="#3b3a33">account</text>
  <text x="772" y="292" font-size="17" fill="#4a4942">Reset access, check</text>
  <text x="772" y="320" font-size="17" fill="#4a4942">admins, payment methods</text>
  <text x="772" y="348" font-size="17" fill="#4a4942">and connected apps.</text>

  <!-- STEP 4 -->
  <rect x="1080" y="160" width="300" height="230" rx="16" fill="#f1faf6" stroke="#1baf7a" stroke-width="2"/>
  <circle cx="1124" cy="208" r="24" fill="#1baf7a"/>
  <text x="1124" y="216" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1164" y="216" font-size="21" font-weight="600" fill="#3b3a33">Request a</text>
  <text x="1164" y="242" font-size="21" font-weight="600" fill="#3b3a33">review</text>
  <text x="1112" y="292" font-size="17" fill="#4a4942">Under "What you can do",</text>
  <text x="1112" y="320" font-size="17" fill="#4a4942">select Request review and</text>
  <text x="1112" y="348" font-size="17" fill="#4a4942">complete the steps.</text>

  <!-- arrows between steps -->
  <path d="M362 275 h34" stroke="#2a78d6" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M702 275 h34" stroke="#2a78d6" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M1042 275 h34" stroke="#1baf7a" stroke-width="3" marker-end="url(#arg)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2a78d6"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1baf7a"/>
    </marker>
  </defs>

  <!-- branch down from step 4 -->
  <path d="M1230 392 v58" stroke="#d9d8d0" stroke-width="3"/>
  <path d="M1230 450 h-820" stroke="#d9d8d0" stroke-width="3"/>
  <path d="M410 450 v40" stroke="#1baf7a" stroke-width="3" marker-end="url(#arg)"/>
  <path d="M1230 450 v40" stroke="#eb6834" stroke-width="3" marker-end="url(#aro)"/>
  <defs>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#eb6834"/>
    </marker>
  </defs>

  <!-- outcome: approved -->
  <rect x="200" y="500" width="420" height="180" rx="16" fill="#f1faf6" stroke="#1baf7a" stroke-width="2"/>
  <text x="236" y="552" font-size="21" font-weight="600" fill="#117a55">Review approved</text>
  <text x="236" y="596" font-size="17" fill="#4a4942">Access returns. Fix the underlying</text>
  <text x="236" y="624" font-size="17" fill="#4a4942">cause before you scale spend again,</text>
  <text x="236" y="652" font-size="17" fill="#4a4942">or you land back here.</text>

  <!-- outcome: denied -->
  <rect x="820" y="500" width="420" height="180" rx="16" fill="#fdf6f2" stroke="#eb6834" stroke-width="2"/>
  <text x="856" y="552" font-size="21" font-weight="600" fill="#a34a1e">Review denied</text>
  <text x="856" y="596" font-size="17" fill="#4a4942">Resubmitting the same text rarely</text>
  <text x="856" y="624" font-size="17" fill="#4a4942">changes the answer. Add what</text>
  <text x="856" y="652" font-size="17" fill="#4a4942">changed since the decision.</text>

  <text x="60" y="756" font-size="16" fill="#8a8980">Steps and timeframe from Meta Business Help Center pages 422289316306981, 530209463124901 and 2058515294227817, checked 27 July 2026.</text>
</svg>
