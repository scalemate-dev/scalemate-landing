<svg width="1440" height="810" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <text x="60" y="64" font-size="34" font-weight="600" fill="#3b3a33">How a tool reaches your ad account</text>
  <text x="60" y="104" font-size="20" fill="#6b6a62">Same task, two very different access patterns, two different risk profiles.</text>

  <!-- LEFT: browser automation -->
  <rect x="60" y="150" width="620" height="520" rx="18" fill="#fdf6f2" stroke="#eb6834" stroke-width="2"/>
  <rect x="60" y="150" width="620" height="70" rx="18" fill="#eb6834"/>
  <rect x="60" y="190" width="620" height="30" fill="#eb6834"/>
  <text x="96" y="194" font-size="23" font-weight="600" fill="#ffffff">Browser automation and DOM scraping</text>

  <text x="96" y="266" font-size="18" fill="#4a4942">Drives Ads Manager the way a person would.</text>

  <g transform="translate(96 300)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#ffffff" stroke="#e0b9a4" stroke-width="2"/>
    <text x="75" y="34" font-size="16" fill="#4a4942" text-anchor="middle">The tool</text>
    <text x="75" y="56" font-size="16" fill="#4a4942" text-anchor="middle">(script/extension)</text>

    <path d="M158 35 h60" stroke="#eb6834" stroke-width="3" marker-end="url(#o)"/>

    <rect x="228" y="0" width="150" height="70" rx="10" fill="#ffffff" stroke="#e0b9a4" stroke-width="2"/>
    <text x="303" y="34" font-size="16" fill="#4a4942" text-anchor="middle">Your logged-in</text>
    <text x="303" y="56" font-size="16" fill="#4a4942" text-anchor="middle">session</text>

    <path d="M386 35 h60" stroke="#eb6834" stroke-width="3" marker-end="url(#o)"/>

    <rect x="456" y="0" width="150" height="70" rx="10" fill="#ffffff" stroke="#e0b9a4" stroke-width="2"/>
    <text x="531" y="34" font-size="16" fill="#4a4942" text-anchor="middle">Ads Manager</text>
    <text x="531" y="56" font-size="16" fill="#4a4942" text-anchor="middle">UI</text>
  </g>

  <text x="96" y="424" font-size="18" font-weight="600" fill="#a34a1e">What Meta sees</text>
  <text x="96" y="460" font-size="17" fill="#4a4942">A human account clicking faster than a human can.</text>
  <text x="96" y="492" font-size="17" fill="#4a4942">No app identity, no review record, no audit trail.</text>

  <text x="96" y="546" font-size="18" font-weight="600" fill="#a34a1e">Reviewed by Meta?</text>
  <g transform="translate(96 566)">
    <circle cx="14" cy="14" r="14" fill="#eb6834"/>
    <path d="M8 8 l12 12 M20 8 l-12 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="21" font-size="17" fill="#4a4942">No. Nothing about it passed App Review.</text>
  </g>
  <text x="96" y="638" font-size="17" fill="#4a4942">Nothing here is against the rules by itself. It just</text>
  <text x="96" y="662" font-size="17" fill="#4a4942">looks identical to the patterns Meta flags.</text>

  <!-- RIGHT: official API -->
  <rect x="760" y="150" width="620" height="520" rx="18" fill="#f1faf6" stroke="#1baf7a" stroke-width="2"/>
  <rect x="760" y="150" width="620" height="70" rx="18" fill="#1baf7a"/>
  <rect x="760" y="190" width="620" height="30" fill="#1baf7a"/>
  <text x="796" y="194" font-size="23" font-weight="600" fill="#ffffff">Official Marketing API</text>

  <text x="796" y="266" font-size="18" fill="#4a4942">Talks to Meta as a registered, reviewed app.</text>

  <g transform="translate(796 300)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#ffffff" stroke="#a8dcc4" stroke-width="2"/>
    <text x="75" y="34" font-size="16" fill="#4a4942" text-anchor="middle">Registered</text>
    <text x="75" y="56" font-size="16" fill="#4a4942" text-anchor="middle">Meta app</text>

    <path d="M158 35 h60" stroke="#1baf7a" stroke-width="3" marker-end="url(#g)"/>

    <rect x="228" y="0" width="150" height="70" rx="10" fill="#ffffff" stroke="#a8dcc4" stroke-width="2"/>
    <text x="303" y="34" font-size="16" fill="#4a4942" text-anchor="middle">Scoped token</text>
    <text x="303" y="56" font-size="16" fill="#4a4942" text-anchor="middle">you granted</text>

    <path d="M386 35 h60" stroke="#1baf7a" stroke-width="3" marker-end="url(#g)"/>

    <rect x="456" y="0" width="150" height="70" rx="10" fill="#ffffff" stroke="#a8dcc4" stroke-width="2"/>
    <text x="531" y="34" font-size="16" fill="#4a4942" text-anchor="middle">Marketing API</text>
    <text x="531" y="56" font-size="16" fill="#4a4942" text-anchor="middle">endpoint</text>
  </g>

  <text x="796" y="424" font-size="18" font-weight="600" fill="#117a55">What Meta sees</text>
  <text x="796" y="460" font-size="17" fill="#4a4942">A named app, a permission you approved, and a</text>
  <text x="796" y="492" font-size="17" fill="#4a4942">rate-limited call pattern it already expects.</text>

  <text x="796" y="546" font-size="18" font-weight="600" fill="#117a55">Reviewed by Meta?</text>
  <g transform="translate(796 566)">
    <circle cx="14" cy="14" r="14" fill="#1baf7a"/>
    <path d="M7 14 l5 6 l10 -12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="21" font-size="17" fill="#4a4942">Yes. App Review, plus Business Verification</text>
  </g>
  <text x="840" y="638" font-size="17" fill="#4a4942">for the higher access tier Meta renamed to</text>
  <text x="840" y="662" font-size="17" fill="#4a4942">Marketing API Access Tier on 4 May 2026.</text>

  <defs>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#eb6834"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1baf7a"/>
    </marker>
  </defs>

  <text x="60" y="740" font-size="16" fill="#8a8980">Access levels and App Review: developers.facebook.com access-levels doc. Tier rename: developers.meta.com blog, 4 May 2026. Checked 27 July 2026.</text>
</svg>
