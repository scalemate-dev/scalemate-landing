<svg width="1440" height="810" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1440" height="810" fill="#fcfcfb"/>

  <text x="720" y="70" text-anchor="middle" font-size="34" font-weight="600" fill="#0b0b0b">Stepped budget increases vs one large jump</text>
  <text x="720" y="108" text-anchor="middle" font-size="19" fill="#52514e">Same destination, different number of restarts on the way</text>

  <!-- axes -->
  <line x1="140" y1="660" x2="1330" y2="660" stroke="#e1e0d9" stroke-width="3"/>
  <line x1="140" y1="180" x2="140" y2="660" stroke="#e1e0d9" stroke-width="3"/>
  <text x="118" y="196" text-anchor="end" font-size="17" fill="#898781">budget</text>
  <text x="1330" y="694" text-anchor="end" font-size="17" fill="#898781">days</text>

  <!-- stepped path -->
  <polyline points="140,620 340,620 340,556 540,556 540,492 740,492 740,428 940,428 940,364 1140,364 1140,300 1330,300"
            fill="none" stroke="#1baf7a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#1baf7a">
    <circle cx="340" cy="620" r="8"/>
    <circle cx="540" cy="556" r="8"/>
    <circle cx="740" cy="492" r="8"/>
    <circle cx="940" cy="428" r="8"/>
    <circle cx="1140" cy="364" r="8"/>
  </g>
  <text x="360" y="600" font-size="18" fill="#12724f">+10%</text>
  <text x="560" y="536" font-size="18" fill="#12724f">+10%</text>
  <text x="760" y="472" font-size="18" fill="#12724f">+10%</text>
  <text x="960" y="408" font-size="18" fill="#12724f">+10%</text>
  <text x="1160" y="344" font-size="18" fill="#12724f">+10%</text>

  <!-- single jump path -->
  <polyline points="140,640 540,640 540,300 1330,300"
            fill="none" stroke="#eb6834" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="14 10"/>
  <circle cx="540" cy="640" r="10" fill="#eb6834"/>
  <text x="566" y="470" font-size="20" font-weight="600" fill="#b8471c">one large jump</text>

  <!-- hold-window annotations -->
  <line x1="340" y1="700" x2="540" y2="700" stroke="#898781" stroke-width="2"/>
  <text x="440" y="726" text-anchor="middle" font-size="17" fill="#898781">hold, let events accrue</text>

  <!-- legend -->
  <rect x="960" y="150" width="16" height="16" rx="4" fill="#1baf7a"/>
  <text x="988" y="164" font-size="18" fill="#52514e">scheduled steps</text>
  <rect x="1160" y="150" width="16" height="16" rx="4" fill="#eb6834"/>
  <text x="1188" y="164" font-size="18" fill="#52514e">reflex jump</text>

  <text x="720" y="778" text-anchor="middle" font-size="17" fill="#52514e">Hold between raises: the ad set needs uninterrupted time to reach its event count.</text>
</svg>
