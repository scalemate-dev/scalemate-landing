<svg width="720" height="200" viewBox="0 0 720 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .axis { stroke: #e5e5e5; stroke-width: 1; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 10px; fill: #999; }
    .phase-label { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 10px; fill: #999; }
  </style>

  <!-- Y axis -->
  <line x1="60" y1="30" x2="60" y2="160" class="axis"/>
  <text x="20" y="95" class="axis-label" text-anchor="middle" transform="rotate(-90, 20, 95)">Performance</text>

  <!-- X axis -->
  <line x1="60" y1="160" x2="680" y2="160" class="axis"/>
  <text x="370" y="190" class="axis-label" text-anchor="middle">Time</text>

  <!-- Phase zones -->
  <!-- Learning phase background -->
  <rect x="60" y="30" width="140" height="130" fill="#F0FDF4" opacity="0.5" rx="0"/>
  <!-- Peak phase background -->
  <rect x="200" y="30" width="200" height="130" fill="#EFF6FF" opacity="0.5"/>
  <!-- Fatigue zone background -->
  <rect x="400" y="30" width="280" height="130" fill="#FEF2F2" opacity="0.5"/>

  <!-- Phase labels -->
  <text x="130" y="22" class="phase-label" fill="#16A34A">Learning</text>
  <text x="300" y="22" class="phase-label" fill="#2563EB">Peak Performance</text>
  <text x="540" y="22" class="phase-label" fill="#DC2626">Ad Fatigue Zone</text>

  <!-- Performance curve -->
  <path d="M 80 145 C 120 140, 150 80, 200 55 C 250 35, 300 35, 350 40 C 400 45, 430 55, 480 80 C 530 105, 580 125, 660 148"
    fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gradient fill under curve -->
  <path d="M 80 145 C 120 140, 150 80, 200 55 C 250 35, 300 35, 350 40 C 400 45, 430 55, 480 80 C 530 105, 580 125, 660 148 L 660 160 L 80 160 Z"
    fill="url(#curveGradient)" opacity="0.15"/>

  <defs>
    <linearGradient id="curveGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Peak dot -->
  <circle cx="275" cy="35" r="4" fill="#2563EB"/>
  <text x="275" y="50" class="metric-label" text-anchor="middle">Best CTR, lowest CPA</text>

  <!-- Fatigue start dot -->
  <circle cx="400" cy="45" r="4" fill="#F97316"/>
  <line x1="400" y1="30" x2="400" y2="160" stroke="#F97316" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="400" y="175" class="metric-label" text-anchor="middle" fill="#F97316" font-weight="600">CTR starts dropping</text>

  <!-- Metrics along fatigue zone -->
  <text x="470" y="72" class="metric-label" fill="#DC2626">↑ CPA rising</text>
  <text x="550" y="100" class="metric-label" fill="#DC2626">↑ Frequency climbing</text>
  <text x="610" y="130" class="metric-label" fill="#DC2626">↓ ROAS falling</text>
</svg>
